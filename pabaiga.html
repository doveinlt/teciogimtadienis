<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Su gimtadieniu, tėčiu!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, .28), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, .28), transparent 30%),
                linear-gradient(135deg, #020617, #111827, #172554);
            background-size: 100% 100%, 100% 100%, 200% 200%;
            animation: backgroundMove 10s ease infinite;
        }

        @keyframes backgroundMove {

            0%,
            100% {
                background-position: 0% 0%, 100% 100%, 0% 50%;
            }

            50% {
                background-position: 100% 100%, 0% 0%, 100% 50%;
            }
        }

        .card {
            width: min(620px, 100%);
            position: relative;
            z-index: 5;
            padding: 48px 32px 40px;
            text-align: center;
            border-radius: 30px;
            background: rgba(15, 23, 42, .72);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow:
                0 30px 100px rgba(0, 0, 0, .5),
                inset 0 1px rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            animation: cardIn .9s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(60px) scale(.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .glow {
            position: absolute;
            z-index: -1;
            inset: 15%;
            border-radius: 50%;
            background: rgba(59, 130, 246, .2);
            filter: blur(70px);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(.8);
                opacity: .5;
            }

            to {
                transform: scale(1.2);
                opacity: .9;
            }
        }

        .image-wrap {
            width: 230px;
            height: 230px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 2.5s ease-in-out infinite;
        }

        .image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 25px rgba(0, 0, 0, .35));
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }

            50% {
                transform: translateY(-12px) rotate(2deg);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            font-size: 24px;
            animation: spinBadge 4s linear infinite;
        }

        @keyframes spinBadge {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 7vw, 58px);
            line-height: 1.05;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #34d399, #60a5fa);
            background-size: 300% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: textGradient 4s linear infinite;
        }

        @keyframes textGradient {
            to {
                background-position: 300% center;
            }
        }

        p {
            max-width: 500px;
            margin: 22px auto;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
        }

        .line {
            width: 100px;
            height: 3px;
            margin: 25px auto;
            border-radius: 20px;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #34d399);
        }

        .small {
            color: #94a3b8;
            font-size: 14px;
        }

        .confetti {
            position: fixed;
            z-index: 1;
            width: 12px;
            height: 22px;
            border-radius: 3px;
            opacity: .8;
            animation: fall 6s linear infinite;
        }

        .confetti-1 {
            left: 8%;
            top: -30px;
            background: #60a5fa;
            animation-delay: 0s;
        }

        .confetti-2 {
            left: 25%;
            top: -30px;
            background: #f472b6;
            animation-delay: 1.5s;
        }

        .confetti-3 {
            left: 48%;
            top: -30px;
            background: #fbbf24;
            animation-delay: 3s;
        }

        .confetti-4 {
            left: 67%;
            top: -30px;
            background: #34d399;
            animation-delay: 2s;
        }

        .confetti-5 {
            left: 84%;
            top: -30px;
            background: #a78bfa;
            animation-delay: 4s;
        }

        .confetti-6 {
            left: 93%;
            top: -30px;
            background: #fb7185;
            animation-delay: 5s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-40px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 35px 22px 30px;
            }

            .image-wrap {
                width: 190px;
                height: 190px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="confetti confetti-1"></div>
    <div class="confetti confetti-2"></div>
    <div class="confetti confetti-3"></div>
    <div class="confetti confetti-4"></div>
    <div class="confetti confetti-5"></div>
    <div class="confetti confetti-6"></div>

    <main class="card">
        <div class="glow"></div>

        <div class="image-wrap">
            <img src="https://bluemoji.io/cdn-proxy/646218c67da47160c64a84d5/66b3e594607b5d1305d4f5b7_90.png"
                alt="Šventinis mėlynas emoji">
        </div>

        <div class="badge">🎉</div>

        <h1>Su gimtadieniu, tėčiu!</h1>

        <p>
            Linkiu daug laimės, sveikatos, geros nuotaikos
            ir kuo daugiau gražių akimirkų!
        </p>

        <div class="line"></div>

        <span class="small">Su meile ❤️</span>
    </main>

</body>

</html>
