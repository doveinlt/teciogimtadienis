<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atspėk slaptažodį</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            color: white;
            background: #000;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* =========================
           GALAKTIKOS FONAS
        ========================= */

        #space {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #000;
        }

        /* =========================
           PAGRINDINIS LANGAS
        ========================= */

        .box {
            position: relative;
            z-index: 2;

            width: min(650px, 100%);
            padding: 35px 28px;

            text-align: center;

            background: rgba(5, 5, 10, 0.80);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 0 40px rgba(70, 100, 255, 0.12),
                inset 0 0 30px rgba(255, 255, 255, 0.02);

            animation: boxIn 0.8s ease;
        }

        @keyframes boxIn {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        h1 {
            margin: 0 0 10px;

            font-size: clamp(30px, 7vw, 48px);

            background:
                linear-gradient(90deg,
                    #ffffff,
                    #93c5fd,
                    #c4b5fd,
                    #ffffff);

            background-size: 250% auto;

            color: transparent;

            background-clip: text;
            -webkit-background-clip: text;

            animation: titleMove 5s linear infinite;
        }

        @keyframes titleMove {

            to {
                background-position: 250% center;
            }

        }

        .subtitle {
            color: #9ca3af;

            line-height: 1.6;

            margin-bottom: 30px;

            font-size: 15px;
        }

        /* =========================
           UZUOMINA
        ========================= */

        .hint {

            min-height: 145px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding: 25px;

            margin-bottom: 20px;

            background:
                rgba(15, 15, 25, 0.82);

            border:
                1px solid rgba(148, 163, 184, 0.15);

            border-radius: 18px;

            box-shadow:
                inset 0 0 30px rgba(100, 120, 255, 0.03);
        }

        .hint.animate {

            animation:
                hintIn 0.5s ease;
        }

        @keyframes hintIn {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .hint-label {

            color: #6b7280;

            text-transform: uppercase;

            letter-spacing: 3px;

            font-size: 12px;

            margin-bottom: 12px;
        }

        .hint strong {

            color: #fff;

            font-size:
                clamp(20px, 5vw, 28px);

            line-height: 1.3;
        }

        /* =========================
           INPUT
        ========================= */

        input {

            width: 100%;

            padding: 16px 18px;

            color: white;

            background:
                rgba(0, 0, 0, 0.7);

            border:
                1px solid #333;

            border-radius: 13px;

            outline: none;

            font-size: 17px;

            transition: 0.25s ease;
        }

        input::placeholder {

            color: #666;
        }

        input:focus {

            border-color:
                #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12),

                0 0 25px rgba(99, 102, 241, 0.08);
        }

        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            margin-top: 12px;

            padding: 16px;

            border: 0;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(135deg,
                    #1f2937,
                    #3730a3);

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px rgba(79, 70, 229, 0.3);
        }

        button:active {

            transform:
                scale(0.98);
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {

            min-height: 30px;

            margin-top: 18px;

            font-weight: bold;
        }

        .error {

            color: #f87171;

            animation:
                shake 0.35s ease;
        }

        .success {

            color: #4ade80;
        }

        @keyframes shake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-7px);
            }

            75% {
                transform:
                    translateX(7px);
            }

        }

        /* =========================
           PROGRESS
        ========================= */

        .progress {

            margin-top: 25px;

            color: #6b7280;

            font-size: 13px;
        }

        .progress-bar {

            width: 100%;

            height: 4px;

            margin-top: 10px;

            background: #171717;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-fill {

            height: 100%;

            background:
                linear-gradient(90deg,
                    #6366f1,
                    #8b5cf6,
                    #60a5fa);

            border-radius: 10px;

            transition:
                width 0.5s ease;

            box-shadow:
                0 0 12px rgba(99, 102, 241, 0.7);
        }

        /* =========================
           PABAIGA
        ========================= */

        .ending {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            overflow: hidden;

            justify-content: center;

            align-items: center;

            padding: 24px;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(59, 130, 246, .28),
                    transparent 30%),

                radial-gradient(circle at 80% 80%,
                    rgba(168, 85, 247, .28),
                    transparent 30%),

                linear-gradient(135deg,
                    #020617,
                    #111827,
                    #172554);

            background-size:
                100% 100%,
                100% 100%,
                200% 200%;

            animation:
                endingBg 10s ease infinite;
        }

        .ending.show {

            display: flex;
        }

        @keyframes endingBg {

            0%,
            100% {
                background-position:
                    0 0,
                    100% 100%,
                    0 50%;
            }

            50% {
                background-position:
                    100% 100%,
                    0 0,
                    100% 50%;
            }

        }

        .ending-card {

            width:
                min(620px, 100%);

            position: relative;

            text-align: center;

            padding:
                45px 30px 38px;

            border-radius: 30px;

            background:
                rgba(15, 23, 42, .76);

            border:
                1px solid rgba(255, 255, 255, .15);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .5),

                inset 0 1px rgba(255, 255, 255, .08);

            backdrop-filter:
                blur(20px);

            animation:
                endingIn .9s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes endingIn {

            from {

                opacity: 0;

                transform:
                    translateY(60px) scale(.9);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }

        }

        .ending-image {

            width: 230px;

            height: 230px;

            object-fit: contain;

            animation:
                endingBounce 2.5s ease-in-out infinite;

            filter:
                drop-shadow(0 20px 25px rgba(0, 0, 0, .35));
        }

        @keyframes endingBounce {

            0%,
            100% {

                transform:
                    translateY(0) rotate(-2deg);
            }

            50% {

                transform:
                    translateY(-12px) rotate(2deg);
            }

        }

        .ending-card h2 {

            margin:
                10px 0 18px;

            font-size:
                clamp(34px, 7vw, 58px);

            line-height: 1.05;

            background:
                linear-gradient(90deg,
                    #60a5fa,
                    #c084fc,
                    #34d399,
                    #60a5fa);

            background-size:
                300% auto;

            color: transparent;

            background-clip: text;

            -webkit-background-clip:
                text;

            animation:
                endingText 4s linear infinite;
        }

        @keyframes endingText {

            to {

                background-position:
                    300% center;
            }

        }

        .ending-card p {

            color:
                #cbd5e1;

            font-size: 18px;

            line-height: 1.7;
        }

        .ending-line {

            width: 100px;

            height: 3px;

            margin:
                25px auto;

            border-radius: 20px;

            background:
                linear-gradient(90deg,
                    #60a5fa,
                    #c084fc,
                    #34d399);
        }

        /* =========================
           KONFETI
        ========================= */

        .end-confetti {

            position: absolute;

            width: 12px;

            height: 22px;

            border-radius: 3px;

            animation:
                endFall 6s linear infinite;
        }

        @keyframes endFall {

            from {

                transform:
                    translateY(-50px) rotate(0);
            }

            to {

                transform:
                    translateY(110vh) rotate(720deg);
            }

        }

        .ec1 {
            left: 8%;
            top: -30px;
            background: #60a5fa;
        }

        .ec2 {
            left: 25%;
            top: -30px;
            background: #f472b6;
            animation-delay: 1.5s;
        }

        .ec3 {
            left: 48%;
            top: -30px;
            background: #fbbf24;
            animation-delay: 3s;
        }

        .ec4 {
            left: 67%;
            top: -30px;
            background: #34d399;
            animation-delay: 2s;
        }

        .ec5 {
            left: 84%;
            top: -30px;
            background: #a78bfa;
            animation-delay: 4s;
        }

        .ec6 {
            left: 93%;
            top: -30px;
            background: #fb7185;
            animation-delay: 5s;
        }

        /* =========================
           TELEFONAS
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 12px;

                align-items: center;
            }

            .box {

                padding:
                    28px 18px;

                border-radius:
                    20px;
            }

            h1 {

                font-size:
                    32px;
            }

            .subtitle {

                font-size:
                    14px;
            }

            .hint {

                min-height:
                    130px;

                padding:
                    20px 15px;
            }

            .hint strong {

                font-size:
                    21px;
            }

            input,
            button {

                padding:
                    16px;

                font-size:
                    16px;
            }

            .ending {

                padding:
                    15px;
            }

            .ending-card {

                padding:
                    30px 18px;
            }

            .ending-image {

                width:
                    180px;

                height:
                    180px;
            }

            .ending-card h2 {

                font-size:
                    36px;
            }

            .ending-card p {

                font-size:
                    16px;
            }

        }
    </style>
</head>


<body>

    <!-- GALAKTIKOS CANVAS -->

    <canvas id="space"></canvas>


    <!-- PAGRINDINIS KLAUSIMYNAS -->

    <div class="box">

        <h1>
            Atspėk slaptažodį
        </h1>

        <p class="subtitle">
            Sek užuominas ir po vieną
            atspėk visus žodžius.
        </p>


        <div id="hintBox" class="hint">

            <span class="hint-label">
                Užuomina
            </span>

            <strong id="hint"></strong>

        </div>


        <input id="answer" type="text" autocomplete="off" placeholder="Įrašyk atsakymą...">


        <button id="check">
            Tikrinti atsakymą
        </button>


        <div id="message"></div>


        <div class="progress">

            <span id="progressText">
                1 / 15
            </span>


            <div class="progress-bar">

                <div id="progressFill" class="progress-fill" style="width:6.66%">
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         PABAIGOS EKRANAS
    ========================== -->

    <div id="ending" class="ending">

        <div class="end-confetti ec1"></div>

        <div class="end-confetti ec2"></div>

        <div class="end-confetti ec3"></div>

        <div class="end-confetti ec4"></div>

        <div class="end-confetti ec5"></div>

        <div class="end-confetti ec6"></div>


        <div class="ending-card">

            <img class="ending-image"
                src="https://bluemoji.io/cdn-proxy/646218c67da47160c64a84d5/66b3e594607b5d1305d4f5b7_90.png"
                alt="Sventinis emoji">


            <h2>
                Su gimtadieniu, teti!
            </h2>


            <p>
                Sveikina tave sūnelis Dovydas!<br>
                Linkiu gerų atostogų, laimės
                ir džiaugsmo.<br>
                Myliu ❤️
            </p>


            <div class="ending-line"></div>

        </div>

    </div>


    <script>

        /*
        ================================================
        KLAUSIMAI
        ================================================
        */

        const steps = [

            {
                word: "kopa",
                hint: "Šuns vardas?"
            },

            {
                word: "2014",
                hint: "Sūnaus gimimo metai?"
            },

            {
                word: "ziema",
                hint: "Šaltasis metų laikas?"
            },

            {
                word: "1991",
                hint: "Tavo gimimo metai?"
            },

            {
                word: "gjan",
                hint: "Mėgstamiausia atlikėja?"
            },

            {
                word: "2019",
                hint: "Vidurinės dukters gimimo metai?"
            },

            {
                word: "geguze",
                hint: "Vidurinės dukters gimimo mėnuo?"
            },

            {
                word: "veterinaras",
                hint: "Gyvūnų daktaras?"
            },

            {
                word: "egiptas",
                hint: "Pirma aplankyta atostogų šalis?"
            },

            {
                word: "greta",
                hint: "Mylimiausia moteris?"
            },


            /*
            ============================================
            11 KLAUSIMAS
            ============================================
            */

            {
                word: "2014",
                hint: "Kada įsigytas kotedžas?"
            },


            /*
            ============================================
            12 KLAUSIMAS
            ============================================
            */

            {
                word: "2017",
                hint: "Kada įgytas UK namas?"
            },


            /*
            ============================================
            13 KLAUSIMAS
            ============================================
            */

            {
                word: "2016",
                hint: "Kuriais metais buvai Paryžiuje? (2012-2020)"
            },


            /*
            ============================================
            14 KLAUSIMAS
            ============================================
            */

            {
                word: "trala",
                hint: "Ka senelis vairuoja?"
            },


            /*
            ============================================
            15 KLAUSIMAS
            ============================================
            */

            {
                word: "vyna",
                hint: "Ka mama darydavo iš uogų ir vyšniu??"
            }

        ];


        let current = 0;


        const hint =
            document.getElementById(
                "hint"
            );

        const hintBox =
            document.getElementById(
                "hintBox"
            );

        const answer =
            document.getElementById(
                "answer"
            );

        const check =
            document.getElementById(
                "check"
            );

        const message =
            document.getElementById(
                "message"
            );

        const progressText =
            document.getElementById(
                "progressText"
            );

        const progressFill =
            document.getElementById(
                "progressFill"
            );


        /*
        ================================================
        RODO PABAIGĄ
        ================================================
        */

        function showEnding() {

            document
                .getElementById("ending")
                .classList
                .add("show");

            document.body.style.overflow =
                "hidden";

        }


        /*
        ================================================
        PARODO KLAUSIMĄ
        ================================================
        */

        function showStep() {

            hint.textContent =
                steps[current].hint;


            hintBox.classList.remove(
                "animate"
            );

            void hintBox.offsetWidth;

            hintBox.classList.add(
                "animate"
            );


            answer.value = "";

            answer.focus();


            progressText.textContent =
                `${current + 1} / ${steps.length}`;


            progressFill.style.width =
                `${((current + 1) / steps.length) * 100}%`;

        }


        /*
        ================================================
        TIKRINA ATSAKYMĄ
        ================================================
        */

        function checkAnswer() {

            const value =
                answer.value
                    .trim()
                    .toLowerCase();


            if (
                value ===
                steps[current].word
            ) {

                message.className =
                    "success";

                message.textContent =
                    "Teisingai!";


                current++;


                /*
                Jei visi 15 atspėti
                */

                if (
                    current >=
                    steps.length
                ) {

                    setTimeout(
                        showEnding,
                        500
                    );

                    return;
                }


                /*
                Pereina prie kito
                */

                setTimeout(
                    () => {

                        message.textContent =
                            "";

                        showStep();

                    },
                    450
                );

            }

            else {

                message.className =
                    "error";

                message.textContent =
                    "Neteisingai.";

                answer.select();

            }

        }


        check.addEventListener(
            "click",
            checkAnswer
        );


        answer.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    checkAnswer();

                }

            }
        );


        showStep();


        /*
        ================================================
        GALAKTIKOS ŽVAIGŽDĖS
        ================================================
        */

        const canvas =
            document.getElementById(
                "space"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );


        let stars = [];

        let width = 0;

        let height = 0;


        function createStars() {

            stars = [];


            /*
            Telefonuose mažiau žvaigždžių,
            kad puslapis veiktų sklandžiai.
            */

            const amount =
                Math.min(
                    150,
                    Math.floor(
                        (width * height) /
                        9000
                    )
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                stars.push({

                    x:
                        Math.random()
                        * width,

                    y:
                        Math.random()
                        * height,

                    radius:
                        Math.random()
                        * 1.7
                        + 0.3,

                    speed:
                        Math.random()
                        * 0.25
                        + 0.05,

                    alpha:
                        Math.random()
                        * 0.7
                        + 0.3,

                    twinkle:
                        Math.random()
                        * Math.PI
                        * 2

                });

            }

        }


        function resizeCanvas() {

            width =
                canvas.width =
                window.innerWidth;

            height =
                canvas.height =
                window.innerHeight;


            createStars();

        }


        /*
        ================================================
        PIEŠIA GALAKTIKĄ
        ================================================
        */

        function drawStars() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
            ŽVAIGŽDĖS
            */

            stars.forEach(
                star => {

                    star.twinkle +=
                        0.015;


                    const alpha =
                        star.alpha +
                        Math.sin(
                            star.twinkle
                        ) * 0.2;


                    ctx.beginPath();


                    ctx.arc(
                        star.x,
                        star.y,
                        star.radius,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `rgba(
                            255,
                            255,
                            255,
                            ${Math.max(
                            0.1,
                            alpha
                        )}
                        )`;


                    ctx.fill();


                    star.y +=
                        star.speed;


                    if (
                        star.y >
                        height
                    ) {

                        star.y = 0;

                    }

                }
            );


            /*
            ============================================
            SUJUNGIA ARTIMAS ŽVAIGŽDES
            ============================================
            */

            for (
                let i = 0;
                i < stars.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < stars.length;
                    j++
                ) {

                    const a =
                        stars[i];

                    const b =
                        stars[j];


                    const dx =
                        a.x - b.x;

                    const dy =
                        a.y - b.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance < 120
                    ) {

                        const opacity =
                            (
                                1 -
                                distance / 120
                            ) * 0.13;


                        ctx.beginPath();


                        ctx.moveTo(
                            a.x,
                            a.y
                        );


                        ctx.lineTo(
                            b.x,
                            b.y
                        );


                        ctx.strokeStyle =
                            `rgba(
                                120,
                                150,
                                255,
                                ${opacity}
                            )`;


                        ctx.lineWidth =
                            0.6;


                        ctx.stroke();

                    }

                }

            }


            requestAnimationFrame(
                drawStars
            );

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();

        drawStars();

    </script>

</body>

</html>
